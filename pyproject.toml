[tool.poetry]
name = "ds-ai-intern-assignments"
version = "0.1.0"
description = "Data science and AI internship assignments"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12"
streamlit = "^1.47.1"
chromadb = "^1.0.15"
langgraph = "^0.6.3"
httpx = "^0.28.1"
pydantic = "^2.11.7"
python-dotenv = "^1.1.1"
openai = "^1.99.1"
nest-asyncio = "^1.6.0"
tenacity = "^9.1.2"
pydantic-settings = "^2.10.1"
ollama = "^0.5.3"
transformers = "^4.55.2"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
ruff = "^0.11.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

[tool.ruff]
line-length = 120
exclude = ["*.ipynb"]